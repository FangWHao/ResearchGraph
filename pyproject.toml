[project]
name = "researchgraph"
version = "0.1.0"
description = "可查证的科研会话与研究决定史"
requires-python = ">=3.12,<3.14"
dependencies = ["httpx>=0.28,<1", "jsonschema>=4.23,<5", "zstandard>=0.23,<1"]

[project.scripts]
rg = "rg.cli.main:main"
rg-hook = "rg.hooks.entry:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11", "pyright>=1.1.400"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["rg"]
venvPath = "."
venv = ".venv"
