[project]
name = "researchgraph"
version = "0.2.0"
description = "把 Claude Code / Codex 会话整理成研究时间线"
requires-python = ">=3.12,<3.14"
dependencies = ["httpx>=0.28,<1"]

[project.scripts]
rg = "rg.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11", "pyright>=1.1.400"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rg"]

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_web.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # 行宽交给 ruff format；中文提示词不强行折行

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["rg"]
venvPath = "."
venv = ".venv"
