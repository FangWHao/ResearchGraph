name: 开发验收

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 取回代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 安装固定版本 uv 与 Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.24'
          python-version: '3.12'
          enable-cache: true
      - name: 按锁文件安装依赖
        run: uv sync --locked
      - name: 后端测试
        run: uv run --no-sync pytest -q
      - name: 代码检查
        run: uv run --no-sync ruff check rg tests scripts
      - name: 类型检查
        run: uv run --no-sync pyright rg
      - name: 安装固定版本 Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
      - name: 安装固定版本 pnpm
        run: npm install --global pnpm@12.10.1
      - name: 按前端锁文件安装依赖
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: 前端测试
        working-directory: web
        run: pnpm test
      - name: 前端类型检查与构建
        working-directory: web
        run: pnpm build
      - name: 构建包含界面的 wheel
        env:
          RG_PACKAGE_WEB: '1'
        run: uv build --wheel
      - name: 仓库外安装后能启动
        run: |
          cd "$RUNNER_TEMP"
          uv run --no-project --isolated --with "$GITHUB_WORKSPACE"/dist/researchgraph-*.whl rg --help
          uv run --no-project --isolated --with "$GITHUB_WORKSPACE"/dist/researchgraph-*.whl python -c "from rg.server import web_dir; assert web_dir() and 'site-packages' in str(web_dir())"

  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: 取回代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 安装固定版本 uv 与 Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.24'
          python-version: '3.12'
          enable-cache: true
      - name: 按锁文件安装依赖
        run: uv sync --locked
      - name: 使用系统默认编码运行后端测试
        env:
          PYTHONUTF8: '0'
          PYTHONIOENCODING: utf-8
        run: uv run --no-sync pytest -q
